<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Braidwater Webex Call Listener</title>

  <script
    src="https://unpkg.com/@webex/embedded-app-sdk@latest"
    defer>
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }

    .status {
      padding: 12px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }

    .call {
      padding: 15px;
      border: 2px solid #333;
      margin-bottom: 20px;
    }

    .number {
      font-size: 24px;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f5f5f5;
      padding: 10px;
    }

    .version {
      margin-top: 30px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>

  <h2>Braidwater Webex Call Listener</h2>

  <div class="status">
    <strong>Status:</strong>
    <span id="status">Starting...</span>
  </div>

  <div class="call">
    <h3>Latest Call</h3>

    <p>
      <strong>Caller:</strong><br>
      <span id="caller" class="number">Waiting for a call...</span>
    </p>

    <p>
      <strong>Call type:</strong>
      <span id="type">-</span>
    </p>

    <p>
      <strong>Call state:</strong>
      <span id="state">-</span>
    </p>

    <p>
      <strong>Call ID:</strong>
      <span id="call-id">-</span>
    </p>

    <p>
      <strong>Disconnect reason:</strong>
      <span id="disconnect">-</span>
    </p>
  </div>

  <h3>Raw Webex Event</h3>

  <pre id="raw">No call events received yet.</pre>

  <h3>Event Log</h3>

  <pre id="log">Waiting for events...</pre>

  <div class="version">
    Braidwater Call Listener — TEST VERSION 2
  </div>

  <script>
    window.addEventListener("load", async () => {

      const statusEl = document.getElementById("status");
      const callerEl = document.getElementById("caller");
      const typeEl = document.getElementById("type");
      const stateEl = document.getElementById("state");
      const callIdEl = document.getElementById("call-id");
      const disconnectEl = document.getElementById("disconnect");
      const rawEl = document.getElementById("raw");
      const logEl = document.getElementById("log");

      let eventCount = 0;

      function addLog(message) {
        const time = new Date().toLocaleTimeString();

        const existing =
          logEl.textContent === "Waiting for events..."
            ? ""
            : logEl.textContent;

        logEl.textContent =
          `[${time}] ${message}\n${existing}`;
      }

      try {

        statusEl.textContent = "Connecting to Webex...";

        const app = new window.webex.Application({
          logs: {
            logLevel: 0
          }
        });

        await app.onReady();

        statusEl.textContent = "Connected to Webex";
        addLog("Webex Embedded App SDK ready");

        await app.listen();

        statusEl.textContent = "Listening for incoming calls";
        addLog("Listening for Webex events");

        app.on("sidebar:callStateChanged", (call) => {

          try {

            eventCount++;

            console.log(
              "Webex call event:",
              call
            );

            const callerNumber =
              call?.remoteParticipants?.[0]?.callerID ||
              call?.remoteParticipants?.[0]?.name ||
              "No caller ID supplied";

            callerEl.textContent =
              callerNumber;

            typeEl.textContent =
              call?.callType || "-";

            stateEl.textContent =
              call?.state || "-";

            callIdEl.textContent =
              call?.id || "-";

            disconnectEl.textContent =
              call?.disconnectReason || "-";

            rawEl.textContent =
              JSON.stringify(call, null, 2);

            addLog(
              `Event ${eventCount}: ` +
              `${call?.callType || "unknown"} / ` +
              `${call?.state || "unknown"} / ` +
              `${callerNumber}`
            );

          } catch (eventError) {

            console.error(
              "Error processing call event:",
              eventError
            );

            addLog(
              "ERROR processing call event: " +
              (eventError.message || eventError)
            );
          }

        });

      } catch (error) {

        console.error(
          "Webex initialization error:",
          error
        );

        statusEl.textContent =
          "Webex connection failed: " +
          (error.message || error);

        addLog(
          "INITIALIZATION ERROR: " +
          (error.message || error)
        );
      }

    });
  </script>

</body>
</html>
